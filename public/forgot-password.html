<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRMS - Forgot Password</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="logo">VRMS</div>
  <div></div>
  <div></div>
</nav>

<div class="auth-wrapper">
  <div class="auth-card card">
    <h1>Forgot Password</h1>
    <p class="sub" id="stepSub">Enter your registered mobile number to receive an OTP</p>

    <div id="formError" class="form-error hidden"></div>

    <!-- Step 1: request OTP -->
    <form id="phoneForm">
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="text" id="phone" placeholder="Enter registered mobile number" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="sendBtn">Send OTP</button>
    </form>

    <!-- Step 2: enter OTP + new password (hidden until OTP is sent) -->
    <form id="resetForm" class="hidden">
      <div class="form-group">
        <label>Enter OTP</label>
        <input type="text" id="otp" placeholder="6-digit code" maxlength="6" required>
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password" required>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="resetBtn">Reset Password</button>
      <button type="button" class="btn btn-outline btn-block mt-10" onclick="backToStep1()">Use a different number</button>
    </form>

    <p class="sub mt-20">Remembered your password? <a href="login.html" style="color:var(--blue-link)">Login here</a></p>
  </div>
</div>

<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script>
let savedPhone = '';

document.getElementById('phoneForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('formError');
  const btn = document.getElementById('sendBtn');
  errorBox.classList.add('hidden');

  savedPhone = document.getElementById('phone').value.trim();
  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    const data = await api.post('/forgot-password/send-otp', { phone: savedPhone });
    showToast(data.message, 'success');
    document.getElementById('phoneForm').classList.add('hidden');
    document.getElementById('resetForm').classList.remove('hidden');
    document.getElementById('stepSub').textContent = 'Enter the OTP sent to ' + savedPhone;
  } catch (err) {
    errorBox.textContent = err.message || 'Could not send OTP';
    errorBox.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send OTP';
  }
});

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('formError');
  const btn = document.getElementById('resetBtn');
  errorBox.classList.add('hidden');

  const payload = {
    phone: savedPhone,
    otp: document.getElementById('otp').value.trim(),
    new_password: document.getElementById('newPassword').value,
    new_password_confirmation: document.getElementById('confirmPassword').value,
  };

  btn.disabled = true;
  btn.textContent = 'Resetting...';

  try {
    const data = await api.post('/forgot-password/reset-password', payload);
    showToast(data.message, 'success');
    setTimeout(() => window.location.href = 'login.html', 1200);
  } catch (err) {
    const message = err.errors ? Object.values(err.errors).flat().join(' ') : err.message;
    errorBox.textContent = message;
    errorBox.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
});

function backToStep1() {
  document.getElementById('resetForm').classList.add('hidden');
  document.getElementById('phoneForm').classList.remove('hidden');
  document.getElementById('stepSub').textContent = 'Enter your registered mobile number to receive an OTP';
  document.getElementById('formError').classList.add('hidden');
}
</script>
</body>
</html>
