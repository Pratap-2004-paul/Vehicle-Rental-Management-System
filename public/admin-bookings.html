<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRMS Admin - Manage Bookings</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .admin-layout { display: flex; width: 100%; min-height: calc(100vh - 65px); }
  .sidebar { width: 220px; background: var(--navy); min-height: calc(100vh - 65px); padding: 20px 0; flex-shrink: 0; }
  .sidebar a { display: block; padding: 12px 24px; color: #cbd5e1; font-size: 14px; }
  .sidebar a.active, .sidebar a:hover { background: var(--navy-light); color: #fff; border-left: 3px solid var(--orange); }
  .main { flex: 1; padding: 30px; }
  .main > * { max-width: 1100px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  th, td { padding: 12px 16px; text-align: left; font-size: 14px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
  .link-btn { color: var(--blue-link); font-weight: 600; cursor: pointer; background:none; border:none; font-size:13px; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo">VRMS Admin</div>
  <ul class="nav-links"><li><a href="index.html">View Site</a></li></ul>
  <div class="nav-actions"><button class="btn btn-primary" onclick="logout()">Logout</button></div>
</nav>

<div class="admin-layout">
  <aside class="sidebar">
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="admin-vehicles.html">Vehicles</a>
    <a href="admin-bookings.html" class="active">Bookings</a>
    <a href="admin-customers.html">Customers</a>
    <a href="admin-payments.html">Payments</a>
    <a href="#" onclick="logout()">Logout</a>
  </aside>

  <main class="main">
    <h2 style="color:var(--navy); margin-bottom:20px;">Manage Bookings</h2>
    <div id="tableWrap"><div class="loading">Loading bookings...</div></div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/toast.js"></script>
<script>
requireAdmin();

async function loadBookings() {
  const wrap = document.getElementById('tableWrap');
  try {
    const bookings = await api.get('/bookings');
    if (!bookings.length) { wrap.innerHTML = '<div class="empty-state">No bookings yet.</div>'; return; }

    wrap.innerHTML = `
      <table>
        <thead><tr><th>#</th><th>Customer</th><th>Vehicle</th><th>Dates</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>
          ${bookings.map((b, i) => `
            <tr>
              <td>${i+1}</td>
              <td>${b.user?.name || '—'}</td>
              <td>${b.vehicle?.name || '—'}</td>
              <td>${formatDate(b.pickup_date)} - ${formatDate(b.return_date)}</td>
              <td>₹${Number(b.total_amount).toLocaleString('en-IN')}</td>
              <td><span class="pill pill-${b.status}">${b.status}</span></td>
                            <td>${actionButtons(b)}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } catch (e) {
    wrap.innerHTML = '<div class="empty-state">Could not load bookings.</div>';
  }
}

async function setStatus(id, status) {
  try {
    await api.put('/bookings/' + id + '/status', { status });
    if (typeof showToast === 'function') showToast('Booking updated', 'success');
    loadBookings();
  } catch (e) {
    if (typeof showToast === 'function') showToast(e.message || 'Could not update booking', 'error');
    else alert(e.message || 'Could not update booking');
  }
}

function formatDate(d) {
  return new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

loadBookings();

function actionButtons(b) {
  if (b.status === 'pending') {
    return `
      <button class="link-btn" onclick="setStatus(${b.id}, 'approved')">Approve</button>
      <button class="link-btn" style="color:var(--danger); margin-left:8px;" onclick="setStatus(${b.id}, 'cancelled')">Reject</button>
    `;
  }
  if (['approved', 'upcoming'].includes(b.status)) {
    return `
      <button class="link-btn" onclick="setStatus(${b.id}, 'completed')">Mark Completed</button>
      <button class="link-btn" style="color:var(--danger); margin-left:8px;" onclick="cancelBooking(${b.id})">Cancel</button>
    `;
  }
  return '<span style="color:var(--text-muted);">—</span>'; // already completed or cancelled — nothing left to do
}

async function cancelBooking(id) {
  if (!confirm('Cancel this booking? The customer will see it as cancelled.')) return;
  try {
    await setStatus(id, 'cancelled');
  } catch (e) {
    // setStatus already shows the error via alert/toast below
  }
}
</script>
</body>
</html>
