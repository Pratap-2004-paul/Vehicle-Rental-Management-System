<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRMS - Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="logo">VRMS</div>
  <div></div>
  <div></div>
</nav>

<div class="auth-wrapper">
  <div class="auth-card card">
    <h1>Welcome Back!</h1>
    <p class="sub">Login to your account</p>

    <div id="formError" class="form-error hidden"></div>

    <form id="loginForm">

    <div class="form-group">
        <label>Email Address</label>
        <input 
            type="email" 
            id="email" 
            placeholder="Enter email" 
            required
        >
    </div>

    <div class="form-group">
        <label>Password</label>
        <input 
            type="password" 
            id="password" 
            placeholder="Enter password" 
            required
        >
    </div>

    <button 
        type="submit" 
        class="btn btn-primary btn-block" 
        id="submitBtn"
    >
        Login
    </button>

    <p class="forgot-password">
        <a href="forgot-password.html">Forgot Password?</a>
    </p>

</form>

<p class="sub mt-20">
    Don't have an account?
    <a href="register.html" style="color:var(--blue-link)">
        Register here
    </a>
</p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('formError');
  const submitBtn = document.getElementById('submitBtn');
  errorBox.classList.add('hidden');

  const payload = {
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
  };

  submitBtn.disabled = true;
  submitBtn.textContent = 'Logging in...';

  try {
    const data = await api.post('/login', payload);
    setToken(data.token);
    setCurrentUser(data.user);
    window.location.href = data.user.role === 'admin' ? 'admin-dashboard.html' : 'dashboard.html';
  } catch (err) {
    errorBox.textContent = err.message || 'Invalid email or password';
    errorBox.classList.remove('hidden');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Login';
  }
});
</script>
</body>
</html>
