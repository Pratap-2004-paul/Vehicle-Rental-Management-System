<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRMS - Register</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="logo">VRMS</div>
  <div></div>
  <div></div>
</nav>

<div class="auth-wrapper">
  <div class="auth-card card">
    <h1>Create Your Account</h1>
    <p class="sub">Fill the form to get started</p>

    <div id="formError" class="form-error hidden"></div>

    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter full name" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter email" required>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="phone" placeholder="Enter phone number">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="passwordConfirm" placeholder="Confirm password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Register</button>
    </form>

    <p class="sub mt-20">Already have an account? <a href="login.html" style="color:var(--blue-link)">Login here</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('formError');
  const submitBtn = document.getElementById('submitBtn');
  errorBox.classList.add('hidden');

  const payload = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    password: document.getElementById('password').value,
    password_confirmation: document.getElementById('passwordConfirm').value,
  };

  submitBtn.disabled = true;
  submitBtn.textContent = 'Registering...';

  try {
     const data = await api.post('/register', payload);
    alert(data.message);
    window.location.href = 'login.html';
  } catch (err) {
    let message = err.message;
    if (err.errors) {
      message = Object.values(err.errors).flat().join(' ');
    }
    errorBox.textContent = message;
    errorBox.classList.remove('hidden');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Register';
  }
});
</script>
</body>
</html>
