<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRMS - Contact Us</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .contact-layout { display:flex; gap:30px; max-width:1000px; margin:0 auto; padding:40px 24px; flex-wrap:wrap; }
  .contact-info { flex:1; min-width:260px; }
  .contact-form { flex:1.3; min-width:300px; }
  .info-row { margin-bottom:18px; }
  .info-row .label { font-weight:600; color:var(--navy); font-size:14px; }
  .info-row .value { color:var(--text-muted); font-size:14px; }
</style>
</head>
<body>
<nav class="navbar">
  <div class="logo">VRMS</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="vehicles.html">Vehicles</a></li>
    <li><a href="about.html">About Us</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="nav-actions" id="navGuestActions"><a href="login.html" class="btn btn-outline">Login</a><a href="register.html" class="btn btn-primary">Register</a></div>
  <div class="nav-actions hidden" id="navUserActions"><a href="dashboard.html" class="btn btn-outline" id="navUserName">Dashboard</a><button class="btn btn-primary" onclick="logout()">Logout</button></div>
</nav>

<div class="contact-layout">
  <div class="contact-info card">
    <h2 style="color:var(--navy); margin-bottom:20px;">Contact Us</h2>
    <div class="info-row"><div class="label">Address</div><div class="value">123, MG Road, New Delhi - 110001</div></div>
    <div class="info-row"><div class="label">Phone</div><div class="value">+91 98765 43210</div></div>
    <div class="info-row"><div class="label">Email</div><div class="value">support@vrms.com</div></div>
    <div class="info-row"><div class="label">Working Hours</div><div class="value">Mon - Sun: 9:00 AM - 9:00 PM</div></div>
  </div>

  <div class="contact-form card">
    <div id="contactMsg" class="hidden mt-10" style="color:var(--success); margin-bottom:10px;"></div>
    <form id="contactForm">
      <div class="form-group"><label>Your Name</label><input type="text" id="name" name="name" required></div>
      <div class="form-group"><label>Email Address</label><input type="email" id="email" name="email" required></div>
      <div class="form-group"><label>Message</label><textarea id="message" name="message" rows="5" required></textarea></div>
      <button type="submit" class="btn btn-primary btn-block">Send Message</button>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('contactForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const msg = document.getElementById('contactMsg');

    const response = await fetch('/api/contact', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        },
        body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            message: document.getElementById('message').value
        })
    });

    const data = await response.json();

    if (response.ok) {
        msg.textContent = data.message;
        msg.classList.remove('hidden');
        e.target.reset();
    } else {
        msg.textContent = 'Failed to send message.';
        msg.classList.remove('hidden');
    }
});
</script>
</body>
</html>
