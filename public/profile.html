<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRMS - My Profile</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .dash-layout { display: flex; width: 100%; min-height: calc(100vh - 65px); }
  .sidebar { width: 220px; background: var(--navy); min-height: calc(100vh - 65px); padding: 20px 0; flex-shrink: 0; }
  .sidebar a { display: block; padding: 12px 24px; color: #cbd5e1; font-size: 14px; }
  .sidebar a.active, .sidebar a:hover { background: var(--navy-light); color: #fff; border-left: 3px solid var(--orange); }
  .main { flex: 1; padding: 30px; max-width: 500px; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo">VRMS</div>
  <ul class="nav-links"><li><a href="index.html">Home</a></li></ul>
  <div class="nav-actions hidden" id="navUserActions">
    <a href="dashboard.html" class="btn btn-outline" id="navUserName">Dashboard</a>
    <button class="btn btn-primary" onclick="logout()">Logout</button>
  </div>
  <div class="nav-actions" id="navGuestActions"><a href="login.html" class="btn btn-outline">Login</a></div>
</nav>

<div class="dash-layout">
  <aside class="sidebar">
    <a href="dashboard.html">Dashboard</a>
    <a href="my-bookings.html">My Bookings</a>
    <a href="payment.html">My Payments</a>
    <a href="profile.html" class="active">My Profile</a>
    <a href="#">Change Password</a>
    <a href="#" onclick="logout()">Logout</a>
  </aside>

  <main class="main card">
    <h2 style="color:var(--navy); margin-bottom:20px;">My Profile</h2>
    <div id="formMsg" class="hidden mt-10"></div>
    <form id="profileForm">
      <div class="form-group"><label>Full Name</label><input type="text" id="name"></div>
      <div class="form-group"><label>Email Address</label><input type="email" id="email" disabled></div>
      <div class="form-group"><label>Phone Number</label><input type="text" id="phone"></div>
      <div class="form-group"><label>Address</label><input type="text" id="address"></div>
      <button type="submit" class="btn btn-primary" id="saveBtn">Update Profile</button>
    </form>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

<script>
requireAuth();

async function loadProfile() {
  try {
    const user = await api.get('/me');
    setCurrentUser(user);
    document.getElementById('name').value = user.name || '';
    document.getElementById('email').value = user.email || '';
    document.getElementById('phone').value = user.phone || '';
    document.getElementById('address').value = user.address || '';
  } catch (e) {
    window.location.href = 'login.html';
  }
}

document.getElementById('profileForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('formMsg');
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving...';

  try {
    const data = await api.put('/profile', {
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      address: document.getElementById('address').value,
    });
    setCurrentUser(data.user);
    msg.textContent = 'Profile updated successfully.';
    msg.className = 'mt-10';
    msg.style.color = 'var(--success)';
  } catch (err) {
    msg.textContent = err.message || 'Could not update profile';
    msg.className = 'mt-10';
    msg.style.color = 'var(--danger)';
  } finally {
    btn.disabled = false; btn.textContent = 'Update Profile';
  }
});

loadProfile();
</script>
</body>
</html>
